name: deploy

# Runs only after ci passes on main. Both steps are no-ops until the two secrets
# are set, so a fork without them does not fail.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  render:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: check the hooks are configured
        id: guard
        env:
          BACKEND: ${{ secrets.RENDER_BACKEND_HOOK }}
          FRONTEND: ${{ secrets.RENDER_FRONTEND_HOOK }}
        run: |
          if [ -z "$BACKEND" ] || [ -z "$FRONTEND" ]; then
            echo "deploy hooks not set, skipping" >> $GITHUB_STEP_SUMMARY
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: deploy backend
        if: steps.guard.outputs.ready == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_HOOK }}"

      - name: deploy frontend
        if: steps.guard.outputs.ready == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"
