# Render blueprint. Creates the database, the API and the static frontend, and wires
# the three together without anyone typing a URL into a dashboard.
#
# Deploy: Render dashboard > New > Blueprint > pick this repo.
#
# The two cross-references below are why `normalise_database_url` and `normalise_origin`
# exist in backend/app/config.py, and `normaliseBase` in frontend/src/api/client.js:
# Render injects a bare hostname and a `postgres://` scheme, and the app adapts rather
# than the config pretending it can concatenate strings.

databases:
  - name: hvacr-catalog-db
    plan: free
    region: oregon
    databaseName: catalog
    user: catalog

services:
  - type: web
    name: hvacr-catalog-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hvacr-catalog-db
          property: connectionString
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          name: hvacr-catalog-web
          type: web
          property: host

  - type: web
    name: hvacr-catalog-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hvacr-catalog-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
