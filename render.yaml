# Render blueprint. Creates the database, the API and the static frontend.
#
# Deploy: Render dashboard > New > Blueprint > point it at this repo.
#
# Both services carry an explicit `region`. Leaving it off the database once put it in
# Oregon while the API went to Frankfurt, and `fromDatabase` hands out an internal
# hostname that only resolves inside one region, so the API could not start. See
# ops/runbook.md.
#
# The two cross-service URLs are written out in full rather than wired with
# `fromService`. That looked tempting but `property: host` resolves to the bare service
# name (`hvacr-catalog-api`), not the public hostname, so the frontend ended up calling
# https://hvacr-catalog-api/facets and got a 503. Render names services predictably, so
# the literal URL is both correct and easier to read than an indirection that is wrong.

databases:
  - name: hvacr-catalog-db
    plan: free
    region: oregon
    databaseName: catalog
    user: catalog

services:
  - type: web
    name: hvacr-catalog-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hvacr-catalog-db
          property: connectionString
      - key: SEED_ON_STARTUP
        value: "true"
      # Render mints this on first sync and it is never printed in the repo. Read it
      # from the dashboard when you need to POST a unit. With no value set the write
      # route answers 503 rather than accepting anonymous writes.
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://hvacr-catalog-web.onrender.com

  - type: web
    name: hvacr-catalog-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://hvacr-catalog-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
